# Generic NPC drop system (real OSRS drop tables + rates).
# Data lives in npc_drops.json (generated from the osrsbox monster dataset).
# See content/drops/NpcDropPlugin.kt.

# Master switch for the generic drop handler.
enabled: true

# Economy faucet dial. Every coin (item 995) stack rolled off a real OSRS table is
# multiplied by this before it hits the ground. 1.0 = fully authentic OSRS gp.
# Lower it (e.g. 0.5) to tighten the gp faucet without touching the drop data.
coinMultiplier: 1.0

# Optional dial for non-coin stackable quantities (runes, ammo, etc.). 1.0 = authentic.
quantityMultiplier: 1.0

# NPC ids the generic handler must never drop for, on top of the automatic exclusion
# of any NPC that already has its own death/loot plugin (bosses). Add ids here if a
# monster's real table is undesirable (e.g. an arena/minigame reskin).
excludeIds: []

# ITEM ids the generic handler must never drop, whatever table they sit in. The osrsbox
# import carries content this server has no system for, and a handful of rows whose
# rarity cell parsed as 1.0 (a guaranteed drop). Player reports 2026-09-02: "Ankou drops
# elite caskets" (27 monsters dropped Reward casket (elite) EVERY kill), "scorpion keeps
# dropping Book page 1", "clue scrolls don't work / casket does not open".
excludeItemIds:
  # Clue scrolls — easy/medium/hard/elite/master are LIVE again as of 2026-09-18.
  #
  # The blanket veto here was written on 2026-09-02, when no Treasure Trails system existed.
  # `minigames/cluescrolls` shipped on 2026-09-13 (read → dig → reward casket → tiered loot) but
  # this list was never revisited, so the only clues in the game were the hard and elite rows
  # hand-written onto ~20 boss tables: no easy, no medium and no master scroll existed anywhere,
  # and no regular monster dropped one. From the player's side that reads as "the clue scroll
  # plugin doesn't work" (reported again 2026-09-18) — they never saw a scroll to try it with.
  #
  # Beginner (23182) stays out: `ClueScrolls.Tier` has no BEGINNER tier, so the scroll would sit
  # inert in the pack. Add the tier first, then delete this line.
  - 23182   # beginner — no matching tier in ClueScrolls.Tier, would be inert
  # Reward caskets — still excluded, deliberately.
  #
  # A casket is the REWARD for finishing a trail, not a drop; handing them out from monster tables
  # would let a player skip the trail. The elite casket is also the row that started this list —
  # the osrsbox import put it on 27 monsters at 100%.
  - 23245   # beginner
  - 20546   # easy
  - 20545   # medium
  - 20544   # hard
  - 20543   # elite (was a 100% row on 27 monsters)
  - 19836   # master
  # Book page 1 — a 100% row on the wilderness scorpions.
  - 4569
  # Warrior guild token — this server repurposes 8851 as the Vote Ticket, and the
  # animated-armour tables hand it out at 100%.
  - 8851

# Rows ADDED to a monster's generic table, keyed by the LOWERCASED npc name (so every variant id of
# a monster picks them up, the same way the byName fallback works). The counterpart to
# excludeItemIds: the osrsbox import is authentic, but OSRS also hands out items through content
# this server does not have, and this is where those go back onto a table without regenerating the
# 10 MB npc_drops.json. Each row is an independent Bernoulli roll, exactly like an imported one.
#
#   <npc name>:
#     - { item: <id>, rarity: <0..1>, min: <n>, max: <n>, rolls: <n> }
#
# rarity is required; min defaults to 1, max to min, rolls to 1.
extraDrops:
  # Anti-dragon shield (1540) had NO source in the game as of 2026-09-18 — no shop sold it and it
  # sat on zero drop tables ("no way to obtain anti fire shield"). In OSRS it comes from Duke
  # Horacio via Dragon Slayer, a quest this server does not have. It is now a cheap staple at the
  # Lumbridge General Store AND a common drop from the dragons it protects you from, so a player
  # who walks into dragons without one can still get it from the thing that just killed them.
  # The shield is nearly worthless as armour (+9 slash defence, 20gp) — its value is entirely the
  # dragonfire block in DragonfireFormula, so a common rate is not an economy event.
  green dragon:
    - { item: 1540, rarity: 0.05 }
  blue dragon:
    - { item: 1540, rarity: 0.05 }
  red dragon:
    - { item: 1540, rarity: 0.05 }
  black dragon:
    - { item: 1540, rarity: 0.05 }
  baby blue dragon:
    - { item: 1540, rarity: 0.02 }
  baby green dragon:
    - { item: 1540, rarity: 0.02 }
  baby red dragon:
    - { item: 1540, rarity: 0.02 }
  baby black dragon:
    - { item: 1540, rarity: 0.02 }
