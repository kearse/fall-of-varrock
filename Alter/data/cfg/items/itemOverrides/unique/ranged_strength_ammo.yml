# Ranged strength for every piece of ammunition â€” OSRS Wiki values.
#
# Community batch 2026-09-18 traced "dragon knives / throwing axes are useless" to this, and it
# turned out to be the whole skill: the rev-228 cache ships equipment param 189 (RANGED_STRENGTH)
# on only 59 of 30,644 item defs, and every one of those 59 is a *weapon* (bows, the venator
# family, a ring, an amulet). NO arrow, bolt, dart, knife, thrownaxe or javelin carries it.
#
# `ItemMetadataService` builds `def.bonuses[11]` straight from param 189, and
# `RangedCombatFormula.getMaxHit` reads the summed worn value as `b` in
# `floor(0.5 + a * (b + 64) / 640)`. With b = 0 for every quiver in the game, a 99-Ranged player
# firing dragon arrows maxed around 11 â€” roughly Ranged/10, whatever the bow. The 2026-09-03
# batch patched the four AMMO-LESS bows (`ammoless_bows.yml`) because those were the ones players
# named; everything that actually uses a quiver was still rolling zero.
#
# Melee is unaffected: param 10 (MELEE_STRENGTH) is present on 1253 defs.
#
# Partial documents (no equip_slot): only `ranged_strength` is patched here. Attack bonuses,
# stack rules, requirements and weapon speed all stay as the cache has them.

