---
# Rank capes — the feudal ladder's uniform (see Title.kt / RankCapes.kt and
# docs/war-system-design.md). One cape per noble rank (Squire and up), granted by
# RankPurchase when the rank is bought and rank-gated on equip by RankCapesPlugin,
# so a cape on someone's back is proof of standing — same promise as the armour gate.
#
# Each cape is an otherwise-unobtainable cache item (no shop, drop or minigame here
# hands them out — checked 2026-08-05) renamed into the rank uniform, going plain →
# elaborate up the ladder, and its colour echoes the rank's over-head name colour:
#   Squire   yellow-green — Fremennik green cloak   (plain wool)
#   Soldier  blue         — Fremennik blue cloak    (plain wool; NOT the Castle Wars
#                           hooded cloak 4514/4516 — those read as CW team cloaks)
#   Knight   silver       — white heraldic cloak     (star emblem)
#   Lord     purple       — black cape, purple wreath emblem
#   Minister crimson      — deep crimson soul cape
#   King     gold         — gold-embroidered ceremonial cape
#
# Stats climb with the rank (hybrid — all three styles — because ranks aren't
# style-bound). Ceiling is deliberate: the King's cape sits just UNDER the fire cape
# for defence/strength so the earned combat capes (fire/infernal) stay the trophies.
# Untradeable (rank must be bought, never traded); cost stays 0 like every override.
# NOTE: keep the very first line of this file as `---` (a leading comment block before
# the first `---` is parsed as an empty document and throws MismatchedInputException).
