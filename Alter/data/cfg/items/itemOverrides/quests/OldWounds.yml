# OLD WOUNDS (Asgarnia - BREACH, Quest 4, docs/quests/old-wounds.md): the two documents.
# LIGHT CUSTOM per the quest's development audit - both reuse stock note defs that already carry
# the Read pack verb, with nothing else in the build using them. Untradeable, so they are ALWAYS
# kept on death (PvpDeathDropPlugin keeps untradeables - the quest sends the player into the real
# Wilderness) and can never be traded, sold or alched. The CLIENT renders the cache name and
# examine, so the operator runs Actions -> "Item def cache edit" -> oldwounds to rename them in the
# live cache (until then the pack shows the stock "Orders note" / "Intel report"). data/cfg/objs.csv
# carries the server-side examines. Two documents in one file: the loader splits on '---'.
#
# The Kinshra Field Orders - the stock "Orders note" (28431). Sir Tiffy keeps them at the report.
