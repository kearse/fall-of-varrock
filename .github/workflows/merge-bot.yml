name: Merge on green

# A free stand-in for branch-protection required checks (not available on
# private repos without a paid plan). Comment `/merge` on a PR and this bot
# merges it ONLY if every check that ran on the head commit is green — a
# server compile error (the "build" check) or a client failure ("ship") makes
# it refuse. Optional `/merge squash` or `/merge rebase` pick the method.
#
# Enforcement is by convention: merge through `/merge`, not the green button.
#
# Post-merge pipeline: a merge made with the built-in GITHUB_TOKEN does NOT
# re-trigger push-based workflows, so when no PAT is configured the bot
# dispatches Build images (always) and Ship Client (when client files changed)
# for the merged commit. Set a repo secret MERGE_BOT_TOKEN (a fine-grained PAT
# with Contents + Pull requests: read/write) to merge as yourself instead —
# then push events fire normally and the dispatch fallback is skipped.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read
  actions: write

jobs:
  merge:
    # Only PR comments, from a trusted author, that start with /merge.
    if: >
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      startsWith(github.event.comment.body, '/merge')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          HAS_PAT: ${{ secrets.MERGE_BOT_TOKEN != '' }}
        with:
          github-token: ${{ secrets.MERGE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.issue.number;
            const commentId = context.payload.comment.id;
            const FOOTER = "\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_";

            // Parse the command: `/merge`, `/merge squash`, `/merge rebase`.
            const body = (context.payload.comment.body || "").trim();
            if (body !== "/merge" && !body.startsWith("/merge ")) {
              core.info(`Ignoring non-command comment: ${JSON.stringify(body)}`);
              return;
            }
            let method = "merge";
            const arg = body.slice("/merge".length).trim().toLowerCase();
            if (["merge", "squash", "rebase"].includes(arg)) method = arg;

            const react = (content) =>
              github.rest.reactions.createForIssueComment({ owner, repo, comment_id: commentId, content })
                .catch(() => {});
            const say = (msg) =>
              github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body: msg + FOOTER });
            const refuse = async (why) => { await react("-1"); await say(`🚫 **Not merging.** ${why}`); };

            await react("eyes");

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            if (pr.state !== "open") return refuse("the PR is not open.");
            if (pr.draft)            return refuse("the PR is still a draft — mark it ready first.");
            if (pr.mergeable === false) return refuse("the PR has conflicts with the base branch — resolve them, then `/merge`.");
            if (pr.mergeable === null)  return refuse("GitHub is still computing mergeability — try `/merge` again in a few seconds.");

            const sha = pr.head.sha;

            // Every check run on the head commit must have finished green.
            const runs = await github.paginate(github.rest.checks.listForRef, { owner, repo, ref: sha, per_page: 100 });
            const pending = runs.filter(c => c.status !== "completed");
            const failed  = runs.filter(c => c.status === "completed" && !["success", "skipped", "neutral"].includes(c.conclusion));
            if (pending.length) return refuse(`still running: ${pending.map(c => `\`${c.name}\``).join(", ")}. Re-comment \`/merge\` once they finish.`);
            if (failed.length)  return refuse(`not green: ${failed.map(c => `\`${c.name}\` (${c.conclusion})`).join(", ")}. Fix, then \`/merge\`.`);

            // Fold in legacy commit statuses too.
            const { data: status } = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: sha });
            if (status.state === "pending" && status.total_count > 0) return refuse("a commit status is still pending.");
            if (status.state === "failure") return refuse("a commit status check failed.");

            const green = runs.filter(c => c.conclusion === "success").map(c => c.name);

            // Merge.
            try {
              await github.rest.pulls.merge({ owner, repo, pull_number: prNumber, merge_method: method });
            } catch (e) {
              return refuse(`GitHub refused the merge: ${e.message}`);
            }
            await react("rocket");

            // A GITHUB_TOKEN merge does not re-trigger push workflows — dispatch them.
            let dispatched = [];
            if (process.env.HAS_PAT !== "true") {
              const base = pr.base.ref;
              try {
                await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: "build.yml", ref: base });
                dispatched.push("Build images");
              } catch (e) { core.warning(`build.yml dispatch failed: ${e.message}`); }

              const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: prNumber, per_page: 100 });
              const clientTouched = files.some(f => f.filename.startsWith("client/") || f.filename === "client-build/PatchClient.java");
              if (clientTouched) {
                try {
                  await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: "ship-client.yml", ref: base });
                  dispatched.push("Ship Client");
                } catch (e) { core.warning(`ship-client.yml dispatch failed: ${e.message}`); }
              }
            }

            const checks = green.length ? green.map(n => `\`${n}\``).join(", ") : "(no checks ran)";
            const tail = dispatched.length ? ` Kicked off: ${dispatched.join(", ")}.` : "";
            await say(`✅ **Merged** via \`${method}\` — green: ${checks}.${tail}`);
