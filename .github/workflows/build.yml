name: Build images

# Every push to main builds the game/web/bot images and pushes them to GHCR,
# tagged with the commit's short SHA (and :latest). This never touches
# production — deploying is a separate, MANUAL step: open the Actions tab, pick
# the "Deploy" workflow, and hit "Run workflow" whenever you want to ship.
#
# Runs are intentionally NOT serialized: a burst of merges builds in parallel,
# so nothing gets queued or auto-cancelled (which is what filled the Actions
# tab with "cancelled" runs before). Every commit ends up with its own image,
# so you can deploy or roll back to any of them later.
#
# Pull requests touching Alter/ run the SAME Gradle compile as a check, but stop
# there — no GHCR login, no docker build, no push (see the `if:` on those steps).
# That closes the gap that let a PR whose Kotlin didn't compile reach main: the
# server half used to be built by nothing until after the merge. Because it's
# this workflow doing the checking, a green check on the PR is the same build
# that will run on main.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "Alter/**"
      - ".github/workflows/build.yml"

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

# PRs get one run per branch and a new push cancels the superseded one, so a stale
# check never sits in flight. Main keeps the behaviour described above — the group
# is keyed on the COMMIT, so a burst of merges still builds in parallel and nothing
# is queued behind anything else.
concurrency:
  group: build-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build game distribution
        working-directory: Alter
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon game-server:installDist

      # Publishing is push-to-main only. On a pull request the job ends after the
      # compile above: that's the check, and a PR must never publish an image.
      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          TAG=${GITHUB_SHA::7}
          for img in kol-game:Alter kol-web:Alter/web kol-bot:Alter/discord-bot; do
            name=${img%%:*}; ctx=${img#*:}
            docker build -t "$REGISTRY/$name:$TAG" -t "$REGISTRY/$name:latest" "$ctx"
            docker push "$REGISTRY/$name:$TAG"
            docker push "$REGISTRY/$name:latest"
          done
