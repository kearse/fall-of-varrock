name: Build images

# Every push to main builds the game/web/bot images and pushes them to GHCR,
# tagged with the commit's short SHA (and :latest). This never touches
# production — deploying is a separate, MANUAL step: open the Actions tab, pick
# the "Deploy" workflow, and hit "Run workflow" whenever you want to ship.
#
# Runs are intentionally NOT serialized: a burst of merges builds in parallel,
# so nothing gets queued or auto-cancelled (which is what filled the Actions
# tab with "cancelled" runs before). Every commit ends up with its own image,
# so you can deploy or roll back to any of them later.
on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build game distribution
        working-directory: Alter
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon game-server:installDist

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: |
          TAG=${GITHUB_SHA::7}
          for img in kol-game:Alter kol-web:Alter/web kol-bot:Alter/discord-bot; do
            name=${img%%:*}; ctx=${img#*:}
            docker build -t "$REGISTRY/$name:$TAG" -t "$REGISTRY/$name:latest" "$ctx"
            docker push "$REGISTRY/$name:$TAG"
            docker push "$REGISTRY/$name:latest"
          done
