name: Client Installers

# Builds native Fall of Varrock client installers for Windows, macOS, and Linux
# with jpackage. Each runner packages the pre-patched client jar (hosted at
# fallofvarrock.com/client/fov-client.jar — built + patched by client-build/) plus
# a bundled Java 11 runtime, so players install one file and need nothing else.
#
# Manual trigger (Actions -> Client Installers -> Run workflow). Uploads each
# installer as a build artifact; also attaches them to a GitHub Release when run
# with a tag input.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag to attach installers to (e.g. client-v1). Empty = artifacts only."
        required: false
        default: ""

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            type: exe
            out: "Fall of Varrock-1.0.0.exe"
          - os: macos-latest
            type: dmg
            out: "Fall of Varrock-1.0.0.dmg"
          - os: ubuntu-latest
            type: app-image
            out: "linux-app-image"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install JDK 21 (runs jpackage)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install JDK 11 (bundled client runtime)
        uses: actions/setup-java@v4
        id: jdk11
        with:
          distribution: temurin
          java-version: "11"

      - name: Checkout (for the app icon)
        uses: actions/checkout@v4

      - name: Assemble launcher + seed client
        shell: bash
        run: |
          mkdir -p input
          # Seed copy of the client (first launch is instant; the launcher only
          # downloads later when fov-client.jar changes on the server).
          curl -fSL https://fallofvarrock.com/client/fov-client.jar -o input/fov-client.jar
          # Compile the self-updating launcher (targets Java 11 = the bundled runtime).
          "$JAVA_HOME_11_X64/bin/javac" --release 11 -d lc client-build/launcher/FovLauncher.java
          "$JAVA_HOME_11_X64/bin/jar" cfe input/fov-launcher.jar FovLauncher -C lc .
          ls -l input

      - name: Generate app icon
        shell: bash
        run: |
          SRC=client-build/assets/logo-icon.png
          case "${{ matrix.os }}" in
            windows-latest)
              magick "$SRC" -define icon:auto-resize=256,128,64,48,32,16 icon.ico
              echo "ICON=icon.ico" >> "$GITHUB_ENV" ;;
            macos-latest)
              mkdir icon.iconset
              for s in 16 32 64 128 256 512; do
                sips -z $s $s      "$SRC" --out "icon.iconset/icon_${s}x${s}.png" >/dev/null
                sips -z $((s*2)) $((s*2)) "$SRC" --out "icon.iconset/icon_${s}x${s}@2x.png" >/dev/null
              done
              iconutil -c icns icon.iconset -o icon.icns
              echo "ICON=icon.icns" >> "$GITHUB_ENV" ;;
            ubuntu-latest)
              cp "$SRC" icon.png
              echo "ICON=icon.png" >> "$GITHUB_ENV" ;;
          esac

      - name: Prepare runtime image
        shell: bash
        env:
          JDK11: ${{ steps.jdk11.outputs.path }}
        run: |
          # Linux jpackage app-image fails copying a raw JDK as the runtime
          # (NoSuchFileException .../lib/runtime), so jlink a clean full runtime
          # there. Windows/macOS package fine directly from the JDK.
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            "$JDK11/bin/jlink" --add-modules ALL-MODULE-PATH --module-path "$JDK11/jmods" \
              --output runtime --no-header-files --no-man-pages --strip-debug
            echo "RUNTIME_IMAGE=runtime" >> "$GITHUB_ENV"
          else
            echo "RUNTIME_IMAGE=$JDK11" >> "$GITHUB_ENV"
          fi

      - name: Package
        shell: bash
        run: |
          # JDK 21's jpackage is on PATH from the last setup-java; call it explicitly.
          JPACKAGE="$JAVA_HOME_21_X64/bin/jpackage"
          [ -x "$JPACKAGE" ] || JPACKAGE="$(command -v jpackage)"
          mkdir -p out
          # Per-OS install options. On Windows the missing bit before was shortcuts:
          # without --win-shortcut/--win-menu the setup installs silently with nothing
          # to launch. --win-per-user-install avoids the admin/UAC prompt.
          # (space-free flags only — EXTRA is intentionally unquoted below)
          EXTRA=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            EXTRA="--win-shortcut --win-menu --win-menu-group FallOfVarrock --win-per-user-install --win-help-url https://fallofvarrock.com"
          fi
          "$JPACKAGE" \
            --type ${{ matrix.type }} \
            --name "Fall of Varrock" \
            --app-version 1.0.0 \
            --vendor "Fall of Varrock" \
            --icon "$ICON" \
            --input input \
            --main-jar fov-launcher.jar \
            --main-class FovLauncher \
            --runtime-image "$RUNTIME_IMAGE" \
            --java-options "-Xmx512m" \
            --java-options "-XX:+DisableAttachMechanism" \
            $EXTRA \
            --dest out
          ls -lR out

      - name: Package Linux app-image into a tarball
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: tar -C out -czf "out/FallOfVarrock-linux-x86_64.tar.gz" "Fall of Varrock"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: fov-client-${{ matrix.os }}
          path: |
            out/*.exe
            out/*.dmg
            out/*.tar.gz

      - name: Attach to release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            out/*.exe
            out/*.dmg
            out/*.tar.gz
