name: Deploy

# Push to main = build images + deploy them.
# Manual run with an image_tag = ROLLBACK: skips the build and redeploys that
# existing tag (any previous deploy's short SHA — see the repo's Packages page).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to redeploy (rollback). Leave empty to build this ref."
        required: false
        default: ""

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    if: ${{ github.event_name == 'push' || inputs.image_tag == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build game distribution
        working-directory: Alter
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon game-server:installDist

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: |
          TAG=${GITHUB_SHA::7}
          for img in kol-game:Alter kol-web:Alter/web kol-bot:Alter/discord-bot; do
            name=${img%%:*}; ctx=${img#*:}
            docker build -t "$REGISTRY/$name:$TAG" -t "$REGISTRY/$name:latest" "$ctx"
            docker push "$REGISTRY/$name:$TAG"
            docker push "$REGISTRY/$name:latest"
          done

  deploy:
    needs: [build]
    if: ${{ always() && needs.build.result != 'failure' && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG=${GITHUB_SHA::7}; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Write SSH key
        run: |
          install -m 600 /dev/null deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > deploy_key

      - name: Ship compose + Caddyfile
        run: |
          scp -i deploy_key -o StrictHostKeyChecking=accept-new \
            deploy/docker-compose.prod.yml deploy/Caddyfile deploy/backup.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/kol/"

      - name: Deploy
        run: |
          ssh -i deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -e; cd /opt/kol; chmod +x backup.sh; \
             export IMAGE_TAG='${{ steps.tag.outputs.tag }}'; \
             docker compose -f docker-compose.prod.yml pull; \
             docker compose -f docker-compose.prod.yml up -d --remove-orphans; \
             echo '${{ steps.tag.outputs.tag }}' > .deployed-tag; \
             docker image prune -f >/dev/null"

      - name: Health check
        run: |
          sleep 25
          ssh -i deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -e; \
             nc -z localhost 43594 && echo 'game: port 43594 up'; \
             curl -fsS -o /dev/null http://localhost:80 --max-time 10 || true; \
             docker compose -f /opt/kol/docker-compose.prod.yml ps"
