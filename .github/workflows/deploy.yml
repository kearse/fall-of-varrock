name: Deploy

# MANUAL deploy. Images are built on every push to main by the "Build images"
# workflow, so by the time you deploy they already exist in GHCR. Ship whenever
# you're ready: Actions tab -> Deploy -> "Run workflow".
#
#   - Leave "image_tag" EMPTY -> deploys the current main HEAD (its short SHA),
#     i.e. everything you've merged since the last deploy, in one shot.
#   - Set "image_tag"         -> ROLLBACK: redeploys that existing tag (any
#     earlier deploy's short SHA — see the repo's Packages page).
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to deploy (rollback). Leave empty to deploy current main HEAD."
        required: false
        default: ""

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the Discord changelog can diff deploys

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG=${GITHUB_SHA::7}; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Write SSH key
        run: |
          install -m 600 /dev/null deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > deploy_key

      # Reclaim disk FIRST, before any write to the box (scp/login/pull). A full
      # disk otherwise wedges the deploy at the very first write. Read-only, safe
      # ops only — never touches named volumes (Mongo, saves, NodeBB, certs).
      - name: Reclaim disk on host
        run: |
          ssh -i deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "docker container prune -f >/dev/null 2>&1 || true; \
             docker image prune -af >/dev/null 2>&1 || true; \
             docker builder prune -af >/dev/null 2>&1 || true; \
             echo 'disk after prune:'; df -h / | tail -1"

      - name: Read currently-deployed tag
        id: prev
        run: |
          PREV=$(ssh -i deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cat /opt/kol/.deployed-tag 2>/dev/null || true")
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"

      - name: Ship compose + Caddyfile
        run: |
          scp -i deploy_key -o StrictHostKeyChecking=accept-new \
            deploy/docker-compose.prod.yml deploy/Caddyfile deploy/backup.sh deploy/server.sh deploy/prune.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/kol/"

      - name: Deploy
        run: |
          ssh -i deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -e; cd /opt/kol; chmod +x backup.sh server.sh prune.sh; \
             # Reclaim disk BEFORE pulling so a full box self-heals instead of \
             # wedging the deploy. Only removes stopped containers, images, and \
             # build cache that nothing is using — never touches named volumes, \
             # so Mongo data / player saves / NodeBB / Caddy certs are untouched. \
             docker container prune -f >/dev/null 2>&1 || true; \
             docker image prune -af >/dev/null 2>&1 || true; \
             docker builder prune -af >/dev/null 2>&1 || true; \
             echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin; \
             export IMAGE_TAG='${{ steps.tag.outputs.tag }}'; \
             docker compose -f docker-compose.prod.yml pull; \
             docker compose -f docker-compose.prod.yml up -d --remove-orphans; \
             echo '${{ steps.tag.outputs.tag }}' > .deployed-tag; \
             docker image prune -f >/dev/null"

      - name: Health check
        run: |
          sleep 25
          ssh -i deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -e; \
             nc -z localhost 43594 && echo 'game: port 43594 up'; \
             curl -fsS -o /dev/null http://localhost:80 --max-time 10 || true; \
             docker compose -f /opt/kol/docker-compose.prod.yml ps"

      # Auto-announce the deploy to Discord. Inserts a kind:"update" event into
      # the discord_events queue the bot already drains (routed to the news
      # channel, falls back to the status feed) — no webhook secret needed.
      # The changelog is every non-merge commit since the last deployed tag
      # (from .deployed-tag on the box), so one manual deploy covering a batch
      # of merges announces the whole batch. Best-effort: a hiccup here never
      # marks the deploy itself as failed.
      - name: Announce update to Discord
        if: ${{ success() }}
        continue-on-error: true
        run: |
          NEW='${{ steps.tag.outputs.tag }}'
          PREV='${{ steps.prev.outputs.tag }}'
          SUBJECTS=""
          if [ -n "$PREV" ] && [ "$PREV" != "$NEW" ] \
             && git rev-parse --verify "$PREV^{commit}" >/dev/null 2>&1 \
             && git rev-parse --verify "$NEW^{commit}" >/dev/null 2>&1; then
            SUBJECTS=$(git log --no-merges --reverse --format='- %s' "$PREV..$NEW")
          fi
          if [ -z "$SUBJECTS" ]; then
            SUBJECTS=$(git log --no-merges -1 --format='- %s' "$NEW")
          fi
          DOC=$(jq -n --arg desc "$SUBJECTS" \
            '{ kind: "update",
               title: "Server update deployed",
               description: ($desc[0:3500]),
               posted: false,
               createdAt: (now * 1000 | floor) }')
          echo "Announcing: $DOC"
          ssh -i deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'docker exec -i $(docker compose -f /opt/kol/docker-compose.prod.yml ps -q mongo) mongosh --quiet lumbridge' \
            <<< "db.discord_events.insertOne($DOC)" \
            || echo "::warning::Discord update announcement failed (deploy unaffected)"
