name: Item def cache edit

# One-click ITEM-def cache edit on the LIVE server, over the same secure SSH path
# the Deploy / NPC-def cache workflows use (secrets DEPLOY_SSH_KEY / DEPLOY_USER /
# DEPLOY_HOST) — no manual SSH needed. Runs the itemDef tool that already ships
# inside the game image (org.alter.tools.itemdef.ItemDefToolKt) against the live
# cache at /opt/kol/runtime/cache.
#
# Item names AND examines are rendered by the CLIENT from its cache def, so a
# server-side override can't change them — this edits the cache directly, and the
# game serves the changed archive to clients over JS5 after a restart. (The
# server-side ground-item examine comes from data/cfg/objs.csv — keep the two in
# sync; the War commendation / Forging material lines already are.)
#
#   inspect      — read-only: print items 4278, 21555 + the quest documents' current
#                  name/examine/flags (safe, do first)
#   warforge     — back up the cache (once, to runtime/cache.precommendation), then rename the
#                  two War-Forging materials and give each an examine that says what it is
#                  and where to spend it (Thurgo, the Royal Smith):
#                    Ecto-token (4278, WarForge.COMMENDATION_KEY) -> "War commendation"
#                    Numulite   (21555, WarForge.MATERIAL_KEY)    -> "Forging material"
#                  then restart the game container (~90s disconnect). Uses the tool's generic
#                  rename/examine verbs, so it works against whatever image is deployed —
#                  the strings below are the same ones in tools/itemdef/ItemDefTool.kt,
#                  itemOverrides/unique/war_forging.yml and objs.csv: keep all four in sync.
#   dispatch     — same backup rule, then rename the "Old note" (item 25829) to
#                  "Weathered Varrock dispatch" with its examine — The North's quest item
#                  (Main Story Quest 3) — and restart the game container
#   oldwounds    — same backup rule, then rename the "Orders note" (28431) to "Kinshra field
#                  orders" and the "Intel report" (761) to "Damaged Temple Knight report", each
#                  with its examine — Old Wounds' two documents (Asgarnia Quest 4) — and restart
#   restore      — swap the pristine backup back (undoes EVERY item edit) and restart the
#                  game container
#
# Actions -> Item def cache edit -> Run workflow -> pick an action.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do to the live item cache"
        type: choice
        required: true
        default: inspect
        options: [inspect, warforge, dispatch, oldwounds, restore]

# Share the deploy group so a cache edit never races a running deploy / other cache op.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Write SSH key
        run: |
          install -m 600 /dev/null deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > deploy_key

      - name: Run item def ${{ inputs.action }} on the VPS
        run: |
          ssh -i deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'bash -s' '${{ inputs.action }}' <<'REMOTE'
          set -euo pipefail
          ACTION="${1:-inspect}"
          cd /opt/kol
          export IMAGE_TAG="$(cat .deployed-tag 2>/dev/null || echo latest)"
          CACHE=/opt/kol/runtime/cache
          BACKUP=/opt/kol/runtime/cache.precommendation
          COMPOSE="docker compose -f docker-compose.prod.yml"

          # ItemDefTool reads a RELATIVE "data/cache" path, so mount the live cache there and
          # run with workdir /app. The mount is bidirectional — the tool's writes land on the
          # host cache. (Its own data/cache-backups backup is ephemeral in the --rm container;
          # we take a real shell-level backup below and restore from that instead.)
          run_tool() {
            $COMPOSE run --rm -T --no-deps \
              -v "$CACHE":/app/data/cache -w /app --entrypoint java game \
              -cp '/app/lib/*' org.alter.tools.itemdef.ItemDefToolKt "$@"
          }

          echo "== item def cache: $ACTION (image tag $IMAGE_TAG) =="
          case "$ACTION" in
            inspect)
              run_tool inspect 4278 21555 25829 28431 761
              ;;
            warforge)
              if [ ! -d "$BACKUP" ]; then
                cp -r "$CACHE" "$BACKUP"
                echo "backed up pristine cache -> $BACKUP"
              else
                echo "pristine backup already exists ($BACKUP) — keeping it"
              fi
              run_tool rename 4278 War commendation
              run_tool examine 4278 "Won in the realm's marches and campaigns. Bring these to Thurgo, the Royal Smith at Lumbridge Castle, to war-forge elite armour."
              run_tool rename 21555 Forging material
              run_tool examine 21555 "Twisted metal and stone salvaged from fallen Varrock. Bring it to Thurgo, the Royal Smith at Lumbridge Castle, to war-forge elite armour."
              run_tool inspect 4278 21555
              $COMPOSE restart game
              echo "game container restarted — relog to see the Ecto-token as the War commendation and Numulite as Forging material"
              ;;
            dispatch)
              if [ ! -d "$BACKUP" ]; then
                cp -r "$CACHE" "$BACKUP"
                echo "backed up pristine cache -> $BACKUP"
              else
                echo "pristine backup already exists ($BACKUP) — keeping it"
              fi
              run_tool dispatch
              $COMPOSE restart game
              echo "game container restarted — relog to see the Old note become the Weathered Varrock dispatch"
              ;;
            oldwounds)
              if [ ! -d "$BACKUP" ]; then
                cp -r "$CACHE" "$BACKUP"
                echo "backed up pristine cache -> $BACKUP"
              else
                echo "pristine backup already exists ($BACKUP) — keeping it"
              fi
              run_tool oldwounds
              $COMPOSE restart game
              echo "game container restarted — relog to see the Kinshra field orders and the Damaged Temple Knight report"
              ;;
            restore)
              if [ ! -d "$BACKUP" ]; then
                echo "ERROR: no backup at $BACKUP — nothing to restore"; exit 1
              fi
              $COMPOSE stop game
              rm -rf "$CACHE"
              cp -r "$BACKUP" "$CACHE"
              $COMPOSE up -d game
              echo "restored pristine cache + restarted game"
              ;;
            *)
              echo "unknown action: $ACTION"; exit 1 ;;
          esac
          REMOTE
