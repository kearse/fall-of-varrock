name: Head-icon cache edit (keys-only loot key icons)

# One-click head-icon cache edit on the LIVE server, over the same secure SSH path
# the Deploy / NPC def cache workflows use (secrets DEPLOY_SSH_KEY / DEPLOY_USER /
# DEPLOY_HOST). Runs the headIcons tool that ships inside the game image
# (org.alter.tools.headicons.HeadIconsToolKt) against the live cache at
# /opt/kol/runtime/cache.
#
# The overhead loot-key icons (headicons_pk frames 8-12) ship as a skull with keys
# hanging under it. This edit erases the skull pixels so a key-carrier shows JUST
# the keys above their head. The client renders these from the shared cache, which
# the game serves over JS5 — clients pull the change after a restart.
#
#   inspect  — read-only: print the frame table + erase-count dry run (safe, do first)
#   apply    — back up the cache (once, to runtime/cache.preheadicons), erase the
#              skull from the keyed frames, then restart the game container
#              (~90s disconnect)
#   restore  — swap the pristine backup back and restart the game container
#
# Actions -> Head-icon cache edit -> Run workflow -> pick an action.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do to the live head-icon sprites"
        type: choice
        required: true
        default: inspect
        options: [inspect, apply, restore]

# Share the deploy group so a cache edit never races a running deploy / other cache op.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Write SSH key
        run: |
          install -m 600 /dev/null deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > deploy_key

      - name: Run head-icon ${{ inputs.action }} on the VPS
        run: |
          ssh -i deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'bash -s' '${{ inputs.action }}' <<'REMOTE'
          set -euo pipefail
          ACTION="${1:-inspect}"
          cd /opt/kol
          export IMAGE_TAG="$(cat .deployed-tag 2>/dev/null || echo latest)"
          CACHE=/opt/kol/runtime/cache
          BACKUP=/opt/kol/runtime/cache.preheadicons
          COMPOSE="docker compose -f docker-compose.prod.yml"

          # HeadIconsTool reads a RELATIVE "data/cache" path, so mount the live cache there and
          # run with workdir /app. The mount is bidirectional — the tool's writes land on the
          # host cache. (Its own data/cache_backup_headicons backup is ephemeral in the --rm
          # container; we take a real shell-level backup below and restore from that instead.)
          run_tool() {
            $COMPOSE run --rm -T --no-deps \
              -v "$CACHE":/app/data/cache -w /app --entrypoint java game \
              -cp '/app/lib/*' org.alter.tools.headicons.HeadIconsToolKt "$@"
          }

          echo "== head-icon cache: $ACTION (image tag $IMAGE_TAG) =="
          case "$ACTION" in
            inspect)
              run_tool inspect
              ;;
            apply)
              if [ ! -d "$BACKUP" ]; then
                cp -r "$CACHE" "$BACKUP"
                echo "backed up pristine cache -> $BACKUP"
              else
                echo "pristine backup already exists ($BACKUP) — keeping it"
              fi
              run_tool apply
              $COMPOSE restart game
              echo "game container restarted — relog to see keys-only loot key icons"
              ;;
            restore)
              if [ ! -d "$BACKUP" ]; then
                echo "ERROR: no backup at $BACKUP — nothing to restore"; exit 1
              fi
              $COMPOSE stop game
              rm -rf "$CACHE"
              cp -r "$BACKUP" "$CACHE"
              $COMPOSE up -d game
              echo "restored pristine cache + restarted game"
              ;;
            *)
              echo "unknown action: $ACTION"; exit 1 ;;
          esac
          REMOTE
