name: Server Ops

# Restart, redeploy, or inspect the VPS stack from the Actions tab — works
# from any browser (or the GitHub mobile app), no SSH access needed.
#
#   restart   restart containers in place (fastest; no image pull)
#   redeploy  re-pull the currently deployed tag and recreate containers
#   stop      stop the stack / one service
#   start     start the stack / one service
#   status    show container states + deployed tag
#   logs      print the last 200 log lines
#
#   inspect-save  READ-ONLY: dump a player's on-disk save files (set "player")
#   reset-save    move a player's corrupt save aside, reversibly (set "player")
#   inspect-route READ-ONLY: dump a recorded ::recroute march path ("player" = the
#                 recorder; blank = every recorded route)
#
# This never builds images. To rebuild from source, run the Deploy workflow
# (or just push to main).

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        required: true
        default: restart
        options: [restart, redeploy, stop, start, status, logs, dump-ge-locs, inspect-save, reset-save, inspect-route]
      service:
        description: "Which service (all = whole stack)"
        type: choice
        required: true
        default: all
        options: [all, game, web, discord-bot, forum, caddy, mongo]
      player:
        description: "Player name — required for inspect-save / reset-save; optional for inspect-route (blank = all)"
        type: string
        required: false
        default: ""

# Share the deploy group so ops never race a running deploy
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write SSH key
        run: |
          install -m 600 /dev/null deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > deploy_key

      - name: Ship latest server.sh
        run: |
          scp -i deploy_key -o StrictHostKeyChecking=accept-new \
            deploy/server.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/kol/server.sh"

      - name: Run ${{ inputs.action }}
        env:
          # Pass inputs through the environment (never interpolate untrusted
          # ${{ }} straight into the shell) and validate the player name so it
          # can't inject anything into the remote command.
          ACTION: ${{ inputs.action }}
          SERVICE: ${{ inputs.service }}
          PLAYER: ${{ inputs.player }}
          DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          case "$ACTION" in
            inspect-save|reset-save)
              if ! printf '%s' "$PLAYER" | grep -qE '^[A-Za-z0-9_]+$'; then
                echo "The '$ACTION' action requires a valid 'player' name (letters, digits, underscore)." >&2
                exit 1
              fi
              ARGS="$PLAYER"
              ;;
            inspect-route)
              # player is OPTIONAL here (blank = dump every recorded route);
              # validate it only when one is given so it can't inject anything.
              if [ -n "$PLAYER" ] && ! printf '%s' "$PLAYER" | grep -qE '^[A-Za-z0-9_]+$'; then
                echo "The 'player' name for inspect-route must be letters, digits, underscore (or blank for all)." >&2
                exit 1
              fi
              ARGS="$PLAYER"
              ;;
            *)
              ARGS="$SERVICE"
              if [ "$ARGS" = all ]; then ARGS=''; fi
              ;;
          esac
          ssh -i deploy_key -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_TARGET" \
            "chmod +x /opt/kol/server.sh; /opt/kol/server.sh '$ACTION' $ARGS"

      - name: Health check
        if: ${{ inputs.action == 'restart' || inputs.action == 'redeploy' || inputs.action == 'start' }}
        run: |
          sleep 25
          ssh -i deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -e; \
             /opt/kol/server.sh status; \
             nc -z localhost 43594 && echo 'game: port 43594 up'"
