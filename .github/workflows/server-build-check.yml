name: Server build check

# Compiles the Kotlin game server on pull requests, so server-side changes are
# checked BEFORE they reach main.
#
# Why this exists: "Build images" (build.yml) only runs on push to main, and
# "Ship Client" (ship-client.yml) only builds client/. A PR touching Alter/ was
# therefore compiled by nothing, and a broken merge was only discovered once it
# had already landed on main. This closes that gap.
#
# Deliberately compile-only: no GHCR login, no docker build, no push, and a
# read-only token. Publishing images stays the exclusive job of build.yml on
# main. The Gradle invocation is kept identical to build.yml's so that a green
# check here means main will build.
on:
  pull_request:
    paths:
      - "Alter/**"
      - ".github/workflows/server-build-check.yml"
  workflow_dispatch:

# Only the PR's tip matters — a new push cancels the in-flight check.
concurrency:
  group: server-build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile game server
        working-directory: Alter
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon game-server:installDist
